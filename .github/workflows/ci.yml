#name
name: ci workflow

#events
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

#jobs
jobs:
  lint:
    name: Run Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint Script
        run: npm run lint
  test:
    name: Run Testing
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      TEST_DB_URI: ${{ secrets.TEST_DB_URI }}
      DB_URI: ${{ secrets.DB_URI }}
      ACCESS_EXPIRY_TIME: ${{ secrets.ACCESS_EXPIRY_TIME }}
      REFRESH_EXPIRY_TIME: ${{ secrets.REFRESH_EXPIRY_TIME }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      SENDER_PASS: ${{ secrets.SENDER_PASS }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Script
        run: npm run test
