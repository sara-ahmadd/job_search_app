#name
name: ci workflow

#events
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

#jobs
jobs:
  lint:
    name: Run Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint Script
        run: npm run lint
  test:
    name: Run Testing
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Script
        run: npm run test
